
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-k8s12
spec:
  replicas: 20
  selector:
    matchLabels:
      app: project-k8s12
  template:
    metadata:
      labels:
        app: project-k8s12
    spec:
      containers:
      - name: project-k8s12
        image: 3booda24/nodejs8
        ports:
        - containerPort: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: project-k8s12
spec:
  type: NodePort
  selector:
    app: project-k8s12
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000 #container port
    nodePort: 30080
